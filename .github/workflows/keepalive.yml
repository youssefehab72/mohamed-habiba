name: Keep the database awake

# Supabase pauses free projects after about a week with no activity.
# This pings the database every 2 days (using the public address and key in config.js),
# and once a month it makes a tiny commit so GitHub keeps running this schedule
# (GitHub stops schedules on repos with no activity for 60 days).

on:
  schedule:
    - cron: "17 6 */2 * *"
    - cron: "41 7 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping the database
        run: |
          URL=$(grep -o 'SUPABASE_URL: "[^"]*' config.js | cut -d'"' -f2)
          KEY=$(grep -o 'SUPABASE_KEY: "[^"]*' config.js | cut -d'"' -f2)
          for i in 1 2 3; do
            if curl -fsS -X POST "$URL/rest/v1/rpc/filled_count" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'; then
              echo; echo "Database is awake."; exit 0
            fi
            sleep 30
          done
          echo "Could not reach the database"; exit 1
      - name: Monthly heartbeat commit
        if: github.event.schedule == '41 7 1 * *' || github.event_name == 'workflow_dispatch'
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > heartbeat.txt
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git add heartbeat.txt
          git commit -m "Monthly heartbeat" || exit 0
          git push
