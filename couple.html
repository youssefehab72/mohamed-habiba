<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Our Memories</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%239b3a4d' d='M20 30H40C40 16 60 16 60 30H80V50C94 50 94 70 80 70V90H60C60 78 40 78 40 90H20V70C32 70 32 50 20 50Z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=El+Messiri:wght@600&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css?v=2">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <button class="chip-btn" id="logout" data-t="cLogout" hidden></button>
    <button class="chip-btn" id="langBtn" data-t="langSwitch">English</button>
  </div>

  <header class="hero">
    <svg class="emblem" viewBox="0 0 100 100" aria-hidden="true"><path fill="currentColor" d="M20 30H40C40 16 60 16 60 30H80V50C94 50 94 70 80 70V90H60C60 78 40 78 40 90H20V70C32 70 32 50 20 50Z"/></svg>
    <h1 class="couple-names" data-couple></h1>
    <p class="app-title" data-t="cTitle"></p>
    <div class="progress-pill" id="progress" hidden>
      <span class="progress-bar"><i id="progressFill"></i></span>
      <span id="progressText"></span>
    </div>
  </header>

  <p class="notice" id="demoNote" hidden></p>
  <p class="notice err" id="offline" data-t="cOffline" hidden></p>

  <!-- login -->
  <section class="card" id="login" hidden>
    <p style="margin-top:0" data-t="cLoginSub"></p>
    <label class="field" for="pass" data-t="cPass"></label>
    <input class="input" id="pass" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" dir="ltr">
    <div class="status bad" id="loginErr"></div>
    <div class="actions"><button class="btn btn-primary" id="loginBtn" data-t="cOpen"></button></div>
  </section>

  <!-- main -->
  <div id="main" hidden>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabOpen" aria-selected="true" data-t="cOpenPiece"></button>
      <button role="tab" id="tabAll" aria-selected="false" data-t="cAll"></button>
    </div>

    <section id="viewOpen">
      <div class="card">
        <label class="field" for="num" data-t="cPieceNum"></label>
        <div class="row">
          <input class="input piece-input" id="num" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="4" placeholder="#" style="font-size:28px">
          <button class="btn btn-primary" style="width:auto" id="numGo" data-t="cOpen"></button>
        </div>
      </div>
      <div id="memory"></div>
    </section>

    <section id="viewAll" hidden>
      <div class="card">
        <div class="grid" id="grid"></div>
      </div>
    </section>

    <div class="bar">
      <button class="btn btn-ghost btn-small" id="refresh">↻ <span data-t="cRefresh"></span></button>
      <button class="btn btn-soft btn-small" id="download">⬇ <span data-t="cDownload"></span></button>
    </div>
    <p class="status" id="dlStatus" style="text-align:center"></p>
  </div>

  <p class="foot"><a href="index.html?guest" data-t="cGuestPage"></a></p>
</div>

<!-- modal -->
<div class="sheet-back" id="modalBack" hidden><div class="modal" id="modal"></div></div>

<script src="config.js?v=2"></script>
<script src="i18n.js?v=2"></script>
<script src="api.js?v=2"></script>
<script src="couple.js?v=2"></script>
</body>
</html>
